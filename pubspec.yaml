name: riogram
description: RioGram — censorship-resistant cross-platform Telegram client.
publish_to: 'none'
version: 0.6.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  ffi: ^2.1.4
  flutter_dotenv: ^5.2.1
  file_picker: ^8.3.7
  video_player: ^2.10.0
  audioplayers: ^6.5.0
  record: ^6.0.0
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^19.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  flutter_webrtc: ^0.12.12
  permission_handler: ^11.4.0
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
