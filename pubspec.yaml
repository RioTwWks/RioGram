name: riogram
description: RioGram — censorship-resistant cross-platform Telegram client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  ffi: ^2.1.4
  flutter_dotenv: ^5.2.1
  file_picker: ^8.3.7
  flutter_local_notifications: ^19.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
