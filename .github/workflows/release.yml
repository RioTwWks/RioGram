name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для имён артефактов (например 0.1.0)"
        required: false
        default: dev

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAW_VERSION: ${{ github.event.release.tag_name || github.event.inputs.version || 'dev' }}
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
  PROXY_PHANTOM_HOST: ${{ secrets.PROXY_PHANTOM_HOST }}
  PROXY_PHANTOM_PORT: ${{ secrets.PROXY_PHANTOM_PORT }}
  PROXY_PHANTOM_SECRET: ${{ secrets.PROXY_PHANTOM_SECRET }}
  PROXY_STEALTH_HOST: ${{ secrets.PROXY_STEALTH_HOST }}
  PROXY_STEALTH_PORT: ${{ secrets.PROXY_STEALTH_PORT }}
  PROXY_STEALTH_SECRET: ${{ secrets.PROXY_STEALTH_SECRET }}
  REQUIRE_SECRETS: "true"

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: ./scripts/install-linux-build-deps.sh

      - name: Create .env from secrets
        run: ./scripts/generate-env.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache TDLib
        uses: actions/cache@v4
        with:
          path: td/build
          key: tdlib-linux-${{ hashFiles('td/td/mtproto/dpi_bypass/**', 'td/td/mtproto/TlsInit.cpp', 'td/td/mtproto/TcpTransport.*', 'td/CMakeLists.txt', 'scripts/build-tdlib.sh') }}
          restore-keys: tdlib-linux-

      - name: Build TDLib
        env:
          CC: gcc
          CXX: g++
          TD_ENABLE_LTO: "OFF"
          JOBS: 2
        run: ./scripts/build-tdlib.sh

      - name: Build Flutter (Linux)
        run: |
          ./scripts/copy-tdlib.sh linux
          flutter build linux --release
          ./scripts/copy-tdlib-to-bundle.sh linux

      - name: Package
        run: |
          VERSION="${RAW_VERSION#v}"
          ./scripts/package-release.sh linux "${VERSION}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup vcpkg (OpenSSL)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 10b7a178346f3f0abef60cecd5130e295afd8da4
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          runVcpkgInstall: true

      - name: Create .env from secrets
        shell: bash
        run: ./scripts/generate-env.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache TDLib
        uses: actions/cache@v4
        with:
          path: td/build
          key: tdlib-windows-${{ hashFiles('td/td/mtproto/dpi_bypass/**', 'td/CMakeLists.txt', 'scripts/build-tdlib.sh') }}
          restore-keys: tdlib-windows-

      - name: Build TDLib
        run: ./scripts/build-tdlib-windows.ps1
        env:
          VCPKG_INSTALLATION_ROOT: ${{ env.VCPKG_ROOT }}

      - name: Build Flutter (Windows)
        shell: bash
        run: |
          ./scripts/copy-tdlib.sh windows
          flutter build windows --release
          ./scripts/copy-tdlib-to-bundle.sh windows

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ env.RAW_VERSION }}".TrimStart('v')
          ./scripts/package-release.ps1 -Version $version -OutputDir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  build-macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env from secrets
        run: ./scripts/generate-env.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache TDLib
        uses: actions/cache@v4
        with:
          path: td/build
          key: tdlib-macos-${{ hashFiles('td/td/mtproto/dpi_bypass/**', 'td/CMakeLists.txt', 'scripts/build-tdlib.sh') }}
          restore-keys: tdlib-macos-

      - name: Build TDLib
        env:
          JOBS: 4
        run: ./scripts/build-tdlib-macos.sh

      - name: Build Flutter (macOS)
        run: |
          ./scripts/copy-tdlib.sh macos
          flutter build macos --release
          ./scripts/copy-tdlib-to-bundle.sh macos

      - name: Package
        run: |
          VERSION="${RAW_VERSION#v}"
          ./scripts/package-release.sh macos "${VERSION}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip

  build-android:
    name: Android APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: ./scripts/install-linux-build-deps.sh

      - name: Create .env from secrets
        run: ./scripts/generate-env.sh

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          flutter precache --android
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses || true

      - name: Cache OpenSSL (Android)
        uses: actions/cache@v4
        with:
          path: .cache/openssl-android
          key: openssl-android-${{ hashFiles('td/example/android/build-openssl.sh') }}
          restore-keys: openssl-android-

      - name: Cache TDLib (Android)
        uses: actions/cache@v4
        with:
          path: td/example/android/tdlib
          key: tdlib-android-${{ hashFiles('td/td/mtproto/dpi_bypass/**', 'td/example/android/build-tdlib.sh') }}
          restore-keys: tdlib-android-

      - name: Build TDLib (Android)
        run: ./scripts/build-tdlib-android.sh

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./scripts/setup-android-signing.sh

      - name: Build Flutter (Android)
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Package
        run: |
          VERSION="${RAW_VERSION#v}"
          ./scripts/package-release.sh android "${VERSION}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  build-ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env from secrets
        run: ./scripts/generate-env.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache OpenSSL (iOS)
        uses: actions/cache@v4
        with:
          path: td/example/ios/third_party/openssl
          key: openssl-ios-${{ hashFiles('td/example/ios/build-openssl.sh') }}
          restore-keys: openssl-ios-

      - name: Cache TDLib (iOS)
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks/libtdjson.a
            td/build-ios-device
          key: tdlib-ios-${{ hashFiles('td/td/mtproto/dpi_bypass/**', 'scripts/build-tdlib-ios.sh') }}
          restore-keys: tdlib-ios-

      - name: Build TDLib (iOS)
        run: ./scripts/build-tdlib-ios.sh

      - name: Setup iOS signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: ./scripts/setup-ios-signing.sh

      - name: Build Flutter (iOS)
        run: |
          if [[ -f ios/ExportOptions.plist ]]; then
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          else
            flutter build ios --release --no-codesign
          fi

      - name: Package
        run: |
          VERSION="${RAW_VERSION#v}"
          ./scripts/package-release.sh ios "${VERSION}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  publish:
    name: Upload to GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/**
