name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare .env
        run: ./scripts/generate-env.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  tdlib-linux:
    name: TDLib build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            gperf \
            zlib1g-dev \
            libssl-dev

      - name: Cache TDLib build
        uses: actions/cache@v4
        with:
          path: td/build
          key: tdlib-linux-${{ hashFiles('td/td/mtproto/dpi_bypass/**', 'td/td/mtproto/TlsInit.cpp', 'td/td/mtproto/TcpTransport.*', 'td/CMakeLists.txt', 'scripts/build-tdlib.sh') }}
          restore-keys: |
            tdlib-linux-

      - name: Build TDLib
        env:
          CC: gcc
          CXX: g++
          TD_ENABLE_LTO: "OFF"
          JOBS: 2
        run: ./scripts/build-tdlib.sh

      - name: Verify libtdjson
        run: test -f td/build/install/lib/libtdjson.so

      - name: Upload libtdjson artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtdjson-linux
          path: td/build/install/lib/libtdjson.so
          retention-days: 7

  flutter-web:
    name: Flutter build (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare .env
        run: ./scripts/generate-env.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Verify Web bundle
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/js/wss_proxy_hook.js

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: riogram-web
          path: build/web/
          retention-days: 7

  web-e2e:
    name: Web E2E (§8.6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          pip install websockets

      - name: Prepare build
        run: |
          ./scripts/generate-env.sh
          flutter pub get
          SKIP_TDWEB_CHECK=1 ./scripts/build-web.sh
          ./scripts/build-wss-proxy.sh

      - name: Install Playwright
        working-directory: e2e/web
        run: |
          npm install --no-save
          npx playwright install chromium --with-deps

      - name: Run Web E2E
        run: WSS_STABILITY_SECONDS=30 ./scripts/run-web-e2e.sh

  flutter-linux:
    name: Flutter build (Linux)
    needs: tdlib-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: ./scripts/install-linux-build-deps.sh

      - name: Download libtdjson
        uses: actions/download-artifact@v4
        with:
          name: libtdjson-linux
          path: tdlib-artifact

      - name: Prepare Flutter
        run: |
          ./scripts/generate-env.sh
          flutter pub get

      - name: Copy libtdjson to project
        run: |
          mkdir -p td/build/install/lib
          cp tdlib-artifact/libtdjson.so td/build/install/lib/
          TD_INSTALL_DIR="$PWD/td/build/install" ./scripts/copy-tdlib.sh linux

      - name: Build Flutter Linux
        run: |
          flutter build linux --release
          TD_INSTALL_DIR="$PWD/td/build/install" ./scripts/copy-tdlib-to-bundle.sh linux

      - name: Verify bundle
        run: |
          test -f build/linux/x64/release/bundle/riogram
          test -f build/linux/x64/release/bundle/lib/libtdjson.so
