# Allow reverse SSH tunnels to bind to 127.0.0.1 on RU VPS (§8.4).
# Append to /etc/ssh/sshd_config on RU, then: systemctl reload sshd
#
# GatewayPorts clientspecified — tunnel user can bind -R 127.0.0.1:PORT:...
GatewayPorts clientspecified

# Optional: dedicated tunnel user with forced command / no shell
# Match User tunnel
#     AllowTcpForwarding remote
#     X11Forwarding no
#     PermitTTY no
