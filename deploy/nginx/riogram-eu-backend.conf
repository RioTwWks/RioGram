# RioGram EU backend — localhost aggregator (§8.4–8.5)
# Placeholders: __EU_BACKEND_PORT__ (default 8080; use e.g. 18080 if busy)
# Listens on 127.0.0.1:__EU_BACKEND_PORT__, routes:
#   /{telegram_host}/apiws → riogram-wss-proxy :5001
#   /health                → riogram-wss-proxy :5001
#   /                      → Flutter static /opt/riogram/web
# TUNNEL_EU_PORT in web.env must match this listen port.

worker_processes auto;
pid /run/riogram-eu-backend.pid;
error_log /var/log/riogram/eu-backend-error.log warn;

events {
    worker_connections 256;
}

http {
    access_log /var/log/riogram/eu-backend-access.log;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream wss_proxy {
        server 127.0.0.1:5001;
        keepalive 8;
    }

    server {
        listen 127.0.0.1:__EU_BACKEND_PORT__;
        server_name _;
        root /opt/riogram/web;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            proxy_pass http://wss_proxy/health;
        }

        # WSS reverse proxy paths: /venus.web.telegram.org/apiws
        location ~ ^/[a-z0-9.-]+\.(?:web\.)?telegram\.org(/.*)?$ {
            proxy_pass http://wss_proxy;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Flutter Web SPA + static assets
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
